<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>続WEBフォーム作成</title>
        <meta name="descripton" content="続WEBフォーム作成">
    </head>

    <body>
        <p>フォームのラベル</p>
        <p>label で囲んで for 属性を指定すると、テキスト部分（「日本国内」という文字）をクリックしてもチェックボックスにチェックが入る</p>
        <p>input type="checkbox" name="travel" value="日本国内" id="japan"</p>
        <p>label for="japan">日本国内</label</p>
        <input type="checkbox" name="travel" value="日本国内" id="japan">
        <label for="japan">日本国内</label>
        <input type="checkbox" name="travel" value="ヨーロッパ" id="1europe"
        <label for="1europe">ヨーロッパ</label>
    </body>
</html>
